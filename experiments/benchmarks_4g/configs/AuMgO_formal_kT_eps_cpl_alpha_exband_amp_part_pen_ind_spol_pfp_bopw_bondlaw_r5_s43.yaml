# AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43: sanitised training config of a released TRACE-Electrostatics run.
# Au2/MgO(001) (4G-HDNNP data, data/AuMgO_*: 300 / 76 training / validation slabs), TRACE-Redox stack of
# step 26: formal anchor, diabatic ensemble with couplings, carrier band, carrier induction and penetration,
# state polarizability (Au, O), bond partition, bond-oriented Pauli repulsion with its wall (SPEC 33),
# first-principles Pauli table; MgO eps_inf prior (measured 2.95) and Au atom alpha prior.  Cold start,
# 40 epochs, lr 1e-3 cosine to 5e-5, energy weight 10, kT and attention-temperature anneals on.
# Released checkpoint: AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43.pt (docs/electrostatics/MODELS.md), the best checkpoint by validation loss,
# epoch 39 of 40; place it at runs/AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43/model.pt to score it.
#
# Warm-start parent: none (cold start).
# Published run: Mac CPU (device: cpu as below; torch 2.2.0, 4 intra-op threads), both seeds concurrently under
# `nohup nice -n 5`.  Retraining is not bitwise reproducible (1-ulp solver differences, transient NaN recomputations
# by the guard); the reported numbers were measured on the released checkpoint, not on a retraining.  Not checked:
# whether the release code retrains this file to the same model (the package changed after this run).
# Command (from experiments/benchmarks_4g; every path in this file is relative to that directory):
#     mkdir -p runs/AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43 && cp configs/AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43.yaml runs/AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43/config.yaml
#     python run_train_nanguard.py runs/AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43/config.yaml > runs/AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43/log.txt 2>&1
#
# Differences from the published config.yaml: every path made relative to experiments/benchmarks_4g
# (train / valid files, response-prior files, model_save_path, checkpoint_dir, plot_dir);
# Added key: electrostatics.redox.state_polarizability_stiffness: block.  This run trained SPEC 28's 'block'
# stiffness, the only form when it ran (the key did not exist yet).  The current code resolves an absent key to
# 'onsite' (SPEC 28.6), a different energy, so the key is written out to retrain the published model.  The
# released checkpoint stores its own RedoxConfig and loads as 'block' with or without this line.
amp_dtype: bfloat16
amsgrad: true
architecture_version: 2
atomic_energies: null
atomic_energies_from_model: true
attention_distance_penalty: true
attention_dropout: 0.03
attention_ffn_hidden: null
attention_key_dim: null
attention_layer_scale_init: 0.01
attention_num_heads: 2
aux_force_weight: 0.0
aux_stress_weight: 0.0
batch_seeded_rng: true
batch_size: 1
batched_graphs: true
checkpoint_dir: runs/AuMgO_formal_kT_eps_cpl_alpha_exband_amp_part_pen_ind_spol_pfp_bopw_bondlaw_r5_s43/checkpoints
checkpoint_interval: 0
clip_grad_norm: 1.0
correlation_channels: 16
correlation_order: 4
device: cpu
displacement_prob: 0.0
