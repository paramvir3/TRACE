# protocol/Ag_cluster_step9_s42: sanitised training config of a released TRACE-Electrostatics run.
# Step 9's TRACE-Redox stack on a 4G cluster benchmark: the round-5 elec config of this system (PFN's split sizes,
# 300 epochs, batch 32, seed 42) with the electrostatics block of the Au2/MgO step-9 run
# (configs/AuMgO_formal_kT_eps_cpl_alpha_ex_bondlaw_r5_s42.yaml): formal integer charge configurations, diabatic
# ensemble with couplings, exclusion (SPEC 18), the SPEC 23 bond law, kT 0.5 -> 0.1 over 20 epochs,
# model-solved reference energies, seeded batches.
# Prior: Ag atom alpha = 50.97 a.u. (data_pfn/Ag_atom_alpha_prior.xyz).  Written by make_step9_cluster_configs.py.
# Released checkpoint: protocol_Ag_cluster_step9_s42.pt (docs/electrostatics/MODELS.md), the best checkpoint by validation loss,
# epoch 295 of 300; place it at runs/protocol/Ag_cluster_step9_s42/model.pt to score it.
#
# Warm-start parent: none (cold start).
# Published run: Mac CPU (device: cpu as below; torch 2.2.0, 2 intra-op threads), under run_train_nanguard.py.
# The published run stopped at epoch 155 inside PyTorch's autograd engine (RuntimeError: dependency not found
# for MulBackward0; cause not identified) and was resumed from its epoch-148 checkpoint with that checkpoint's
# optimiser, scheduler and reference energies: the resume config was this file without
# atomic_energies_from_model and with resume_from: <the epoch-148 checkpoint>, resume_load_optimizer: true,
# resume_load_scheduler: true.  The released model is the best checkpoint of the resumed run (epoch 295).
# Command (from experiments/benchmarks_4g; every path in this file is relative to that directory):
#     mkdir -p runs/protocol/Ag_cluster_step9_s42 && cp configs/protocol/Ag_cluster_step9_s42.yaml runs/protocol/Ag_cluster_step9_s42/config.yaml
#     python run_train_nanguard.py runs/protocol/Ag_cluster_step9_s42/config.yaml > runs/protocol/Ag_cluster_step9_s42/log.txt 2>&1
#
# Differences from the published config.yaml: every path made relative to experiments/benchmarks_4g
# (train / valid files, response-prior files, model_save_path, checkpoint_dir, plot_dir);
# no key added or removed, no other value changed.
amp_dtype: bfloat16
amsgrad: true
architecture_version: 2
atomic_energies: null
atomic_energies_from_model: true
attention_distance_penalty: true
attention_dropout: 0.03
attention_ffn_hidden: null
attention_key_dim: null
attention_layer_scale_init: 0.01
attention_num_heads: 2
aux_force_weight: 0.0
aux_stress_weight: 0.0
batch_seeded_rng: true
batch_size: 32
batched_graphs: true
checkpoint_dir: runs/protocol/Ag_cluster_step9_s42/checkpoints
checkpoint_interval: 0
clip_grad_norm: 1.0
correlation_channels: 16
correlation_order: 4
device: cpu
displacement_prob: 0.0
displacement_sigma: 0.0
early_stopping_min_delta: 0.0
early_stopping_min_epoch: 1
early_stopping_patience: 0
electrostatics:
  config:
    bond_screening:
    - 2.0
    - 2.8
  enabled: true
  heads:
    bond_hardness_law: two_level
  partial_charge_weight: 0.0
  polarizability_prior:
    file: data_pfn/Ag_atom_alpha_prior.xyz
    weight: 0.3
  redox:
    anchor: formal
    couplings: true
    exclusion: true
    fragment_ensemble: diabatic
    max_charge: 3
energy_shift_per_atom: null
energy_weight: 10.0
epochs: 300
force_consistency_weight: 0.0
forces_weight: 1.0
forces_weight_decay_epochs: 0
forces_weight_final: 1.0
gaussian_width: 0.5
grad_accum_steps: 1
hidden_dim: 64
l_max: 2
learning_rate: 0.001
lr_min: 5.0e-05
lr_restart_mult: 1.0
lr_scheduler_interval: epoch
lr_scheduler_t_max: 300
lr_scheduler_use_restarts: false
lr_warmup_epochs: 0
lr_warmup_start_factor: 0.1
model_save_path: runs/protocol/Ag_cluster_step9_s42/model.pt
muon_aux_betas:
- 0.9
- 0.95
muon_aux_eps: 1.0e-10
muon_exclude: []
muon_include: []
muon_momentum: 0.95
muon_nesterov: true
muon_ns_dtype: auto
muon_ns_steps: 5
muon_parameter_mode: hidden
num_layers: 1
num_radial: 12
num_workers: 0
optimizer: muon
plot_dir: runs/protocol/Ag_cluster_step9_s42/plots
plot_training_curves: true
precompute_neighbors: true
r_max: 5.29
radial_basis_type: bessel
radial_mlp_hidden: 32
radial_mlp_layers: 2
radial_trainable: false
random_rotation: false
redox_kT_epochs: 20
redox_kT_start: 0.5
resume_from: null
save_last_checkpoint: true
seed: 42
sobolev_sigma: 0.02
sobolev_weight: 0.0
solve_atomic_energies: true
stress_weight: 0.0
stress_weight_final: 0.0
stress_weight_ramp_epochs: 0
temperature_scale_end: 1.0
temperature_scale_epochs: 15
temperature_scale_start: 1.3
torch_num_interop_threads: 1
torch_num_threads: 2
train_file: data_pfn/Ag_cluster_train.xyz
use_amp: false
valid_file: data_pfn/Ag_cluster_valid.xyz
weight_decay: 1.0e-05
