# TRACE without electrostatics (local backbone only) on Togo's PBEsol MgO cells; run from the repo root:
#   python train.py --config examples/mgo_phonons_local/config.yaml
# Forces only (energy_weight 0), 40 epochs of a 100-epoch cosine schedule: the settings of the run shown in README.md.
amp_dtype: bfloat16
amsgrad: true
architecture_version: 2
atomic_energies: null
attention_distance_penalty: true
attention_dropout: 0.03
attention_ffn_hidden: null
attention_key_dim: null
attention_layer_scale_init: 0.01
attention_num_heads: 2
aux_force_weight: 0.0
aux_stress_weight: 0.0
batch_size: 1
batched_graphs: true
checkpoint_dir: examples/mgo_phonons_local/run/checkpoints
checkpoint_interval: 0
clip_grad_norm: 1.0
correlation_channels: 16
correlation_order: 4
device: cpu
displacement_prob: 0.0
displacement_sigma: 0.0
early_stopping_min_delta: 0.0
early_stopping_min_epoch: 1
early_stopping_patience: 0
energy_shift_per_atom: null
energy_weight: 0.0
epochs: 40
force_consistency_weight: 0.0
forces_weight: 1.0
forces_weight_decay_epochs: 0
forces_weight_final: 1.0
gaussian_width: 0.5
grad_accum_steps: 8
hidden_dim: 64
l_max: 2
learning_rate: 0.001
lr_min: 5.0e-05
lr_restart_mult: 1.0
lr_scheduler_interval: epoch
lr_scheduler_t_max: 100
lr_scheduler_use_restarts: false
lr_warmup_epochs: 0
lr_warmup_start_factor: 0.1
model_save_path: examples/mgo_phonons_local/run/model.pt
muon_aux_betas:
- 0.9
- 0.95
muon_aux_eps: 1.0e-10
muon_exclude: []
muon_include: []
muon_momentum: 0.95
muon_nesterov: true
muon_ns_dtype: auto
muon_ns_steps: 5
muon_parameter_mode: hidden
num_layers: 1
num_radial: 12
num_workers: 0
optimizer: muon
plot_dir: examples/mgo_phonons_local/run/plots
plot_training_curves: true
precompute_neighbors: true
r_max: 5.29
radial_basis_type: bessel
radial_mlp_hidden: 32
radial_mlp_layers: 2
radial_trainable: false
random_rotation: false
save_last_checkpoint: true
seed: 43
sobolev_sigma: 0.02
sobolev_weight: 0.0
solve_atomic_energies: true
stress_weight: 0.0
stress_weight_final: 0.0
stress_weight_ramp_epochs: 0
temperature_scale_end: 1.0
temperature_scale_epochs: 0
temperature_scale_start: 1.0
torch_num_interop_threads: 1
torch_num_threads: 4
train_file: examples/mgo_phonons_local/data/MgO_PBEsol_ltc_train.xyz
use_amp: false
valid_file: examples/mgo_phonons_local/data/MgO_PBEsol_ltc_valid.xyz
weight_decay: 1.0e-05
